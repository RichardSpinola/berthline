name: audit
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run that holds the packages
        required: true
  workflow_run:
    workflows: [build]
    types: [completed]

concurrency:
  group: audit-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  areas:
    # Which profiles changed: by hand or on a tag, both; otherwise only the ones touched
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.c.outputs.java }}
      web: ${{ steps.c.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [[ "${{ github.event.workflow_run.head_branch }}" == v* ]]; then
            echo "java=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=${{ github.event.workflow_run.head_sha }}
          git diff --name-only "$sha~1" "$sha" > changed.txt
          comum='^(profiles/base/|extension-common/|extension-lite/|build/|tests/audit|tests/auditor|tests/cdp)'
          grep -qE "$comum|^profiles/java/|^extension/|^tests/fixture/java|^hub/troca|^tests/update_test" changed.txt && echo "java=true" >> "$GITHUB_OUTPUT" || echo "java=false" >> "$GITHUB_OUTPUT"
          grep -qE "$comum|^profiles/web/|^extension-web/|^tests/fixture/web" changed.txt && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  windows:
    needs: areas
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: berthline-windows
          path: zip
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: tar -xf zip/berthline-windows.zip -C $env:RUNNER_TEMP
      - name: Audit Java
        if: needs.areas.outputs.java == 'true'
        timeout-minutes: 15
        run: '& "$env:RUNNER_TEMP/berthline-windows/node/node.exe" tests/audit.js "$env:RUNNER_TEMP/berthline-windows" java'
      - name: Audit Web
        if: always() && needs.areas.outputs.web == 'true'
        timeout-minutes: 10
        run: '& "$env:RUNNER_TEMP/berthline-windows/node/node.exe" tests/audit.js "$env:RUNNER_TEMP/berthline-windows" web'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-windows
          path: tests/out

  linux:
    needs: areas
    if: needs.areas.outputs.java == 'true' || needs.areas.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libnss3 libgbm1 libasound2t64 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/download-artifact@v4
        with:
          name: berthline-linux
          path: pkg
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: tar -xzf pkg/berthline-linux.tar.gz -C "$RUNNER_TEMP"
      - name: Audit Java
        if: needs.areas.outputs.java == 'true'
        timeout-minutes: 15
        run: xvfb-run -a --server-args='-screen 0 1280x800x24' "$RUNNER_TEMP/berthline-linux/node/bin/node" tests/audit.js "$RUNNER_TEMP/berthline-linux" java
      - name: Audit Web
        if: always() && needs.areas.outputs.web == 'true'
        timeout-minutes: 10
        run: xvfb-run -a --server-args='-screen 0 1280x800x24' "$RUNNER_TEMP/berthline-linux/node/bin/node" tests/audit.js "$RUNNER_TEMP/berthline-linux" web
      - uses: actions/setup-python@v5
        if: always() && needs.areas.outputs.java == 'true'
        with:
          python-version: '3.13'
      - name: Audit Java after updating from the last release
        if: always() && needs.areas.outputs.java == 'true'
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install PySide6 certifi
          versao=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/berthline-linux/brand.json'))['version'])")
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName -q '.[].tagName' | grep -vx "v$versao" | head -1)
          mkdir -p "$RUNNER_TEMP/old"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern berthline-linux.tar.gz --dir "$RUNNER_TEMP/old"
          tar -xzf "$RUNNER_TEMP/old/berthline-linux.tar.gz" -C "$RUNNER_TEMP/old"
          echo "updating $tag -> $versao"
          xvfb-run -a --server-args='-screen 0 1280x800x24' python -u tests/update_test.py "$RUNNER_TEMP/berthline-linux" --from "$RUNNER_TEMP/old/berthline-linux" --audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-linux
          path: tests/out
