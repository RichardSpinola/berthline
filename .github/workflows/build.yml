name: build
# Slow layer: the package and the tests that click through it. Pull requests to main, tags and by hand.
# The fast layer (fast.yml) runs on every push.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # A UI step that fails is run once more before the job fails; both attempts keep their screenshots and logs
  RETRY: 'for i in 1 2; do "$@" && exit 0; echo "::warning::attempt $i failed: $*"; done; exit 1'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      editor: ${{ steps.areas.outputs.editor }}
      java: ${{ steps.areas.outputs.java }}
      web: ${{ steps.areas.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed areas
        id: areas
        run: |
          # By hand or on a tag, everything; on a pull request, only what the change touches
          if [ "${{ github.event_name }}" != pull_request ]; then
            printf 'editor=true\njava=true\nweb=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          comum='^(profiles/base/|extension-common/|extension-lite/|build/|tests/audit|tests/auditor|tests/cdp|\.github/)'
          grep -qvE '^(hub/|tests/hub_|tests/update_test)' changed.txt && echo editor=true >> "$GITHUB_OUTPUT" || echo editor=false >> "$GITHUB_OUTPUT"
          grep -qE "$comum|^profiles/java/|^extension/|^tests/fixture/java" changed.txt && echo java=true >> "$GITHUB_OUTPUT" || echo java=false >> "$GITHUB_OUTPUT"
          grep -qE "$comum|^profiles/web/|^extension-web/|^tests/fixture/web" changed.txt && echo web=true >> "$GITHUB_OUTPUT" || echo web=false >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: build/requirements.txt
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: build-linux-${{ hashFiles('build/versions.json', 'build/eslint/package-lock.json') }}
          restore-keys: build-linux-
      - run: pip install -r build/requirements.txt
      - run: python build/build.py
      - name: Archive
        # Fast compression for test runs; a release gets the smaller archive
        run: tar -C dist -cf - berthline-linux | gzip -${{ startsWith(github.ref, 'refs/tags/') && '9' || '1' }} > dist/berthline-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: berthline-linux
          path: dist/berthline-linux.tar.gz
          compression-level: 0

  # The checks below run side by side, each on its own copy of the package
  linux-tests:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: build/requirements.txt
      - run: pip install -r build/requirements.txt
      - uses: ./.github/actions/linux-package
      - name: Smoke test
        if: needs.linux.outputs.editor == 'true'
        timeout-minutes: 12
        run: bash -c "$RETRY" _ xvfb-run -a --server-args='-screen 0 1280x800x24' "$PKG/node/bin/node" tests/smoke.js "$PKG"
      - name: Hub tests
        timeout-minutes: 8
        run: |
          bash -c "$RETRY" _ python -u tests/hub_test.py "$PKG"
          bash -c "$RETRY" _ python -u tests/hub_audit.py "$PKG"
      - name: Update test
        timeout-minutes: 10
        run: bash -c "$RETRY" _ python -u tests/update_test.py "$PKG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-linux
          path: tests/out

  linux-audit:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        app: [java, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        if: needs.linux.outputs[matrix.app] == 'true'
      - uses: ./.github/actions/linux-package
        if: needs.linux.outputs[matrix.app] == 'true'
      - name: Audit ${{ matrix.app }}
        if: needs.linux.outputs[matrix.app] == 'true'
        timeout-minutes: 15
        run: bash -c "$RETRY" _ xvfb-run -a --server-args='-screen 0 1280x800x24' "$PKG/node/bin/node" tests/audit.js "$PKG" ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: always() && needs.linux.outputs[matrix.app] == 'true'
        with:
          name: audit-linux-${{ matrix.app }}
          path: tests/out

  windows:
    # Windows builds on tags and by hand; pull requests check Linux only
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: build/requirements.txt
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: build-windows-${{ hashFiles('build/versions.json', 'build/eslint/package-lock.json') }}
          restore-keys: build-windows-
      - run: pip install -r build/requirements.txt
      - run: python build/build.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/berthline-windows -DestinationPath dist/berthline-windows.zip -CompressionLevel ${{ startsWith(github.ref, 'refs/tags/') && 'Optimal' || 'Fastest' }}
      - uses: actions/upload-artifact@v4
        with:
          name: berthline-windows
          path: dist/berthline-windows.zip
          compression-level: 0
      - name: Smoke test
        timeout-minutes: 12
        run: bash -c "$RETRY" _ dist/berthline-windows/node/node.exe tests/smoke.js dist/berthline-windows
      - name: Update test
        timeout-minutes: 15
        run: bash -c "$RETRY" _ python -u tests/update_test.py dist/berthline-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-windows
          path: tests/out

  windows-audit:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        app: [java, web]
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: berthline-windows
          path: zip
      - run: tar -xf zip/berthline-windows.zip -C "$RUNNER_TEMP"
      - name: Audit ${{ matrix.app }}
        timeout-minutes: 15
        run: bash -c "$RETRY" _ "$RUNNER_TEMP/berthline-windows/node/node.exe" tests/audit.js "$RUNNER_TEMP/berthline-windows" ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-windows-${{ matrix.app }}
          path: tests/out

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-audit, linux, linux-tests, linux-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: berthline-*
          merge-multiple: true
      - run: sha256sum berthline-windows.zip berthline-linux.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" berthline-windows.zip berthline-linux.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes
