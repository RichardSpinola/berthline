name: build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PySide6 pyinstaller
      - run: python build/build.py
      - name: Zip
        run: Compress-Archive -Path dist/berthline-windows -DestinationPath dist/berthline-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: berthline-windows
          path: dist/berthline-windows.zip
          compression-level: 0
      - name: Smoke test
        timeout-minutes: 15
        run: dist/berthline-windows/node/node.exe tests/smoke.js dist/berthline-windows
      - name: Trust state
        if: always()
        shell: python
        run: |
          import os, pathlib, sqlite3
          print('tmp', os.environ.get('TEMP'))
          banco = pathlib.Path.home() / '.berthline-shared/sharedStorage/state.vscdb'
          print(banco, banco.exists())
          if banco.exists():
              print(sqlite3.connect(banco).execute("SELECT value FROM ItemTable WHERE key = 'content.trust.model.key'").fetchall())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: tests/out
